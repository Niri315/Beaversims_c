<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/site.css">
    <link rel="stylesheet" href="css/stat-alloc.css">
    <link rel="stylesheet" href="css/result-options.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Stat Allocation</title>
</head>
<body>
    <div id="site-header"></div>

    <main class="container section">
        <section class="card ro" id="result-options" aria-labelledby="ro-title">

            <div class="ro-row">
                <div class="ro-group">
                    <label class="ro-radio">
                        <input type="radio" name="ro-metric" value="total" checked>
                        <span>Total</span>
                    </label>
                    <label class="ro-radio">
                        <input type="radio" name="ro-metric" value="heal">
                        <span>Heal</span>
                    </label>
                    <label class="ro-radio">
                        <input type="radio" name="ro-metric" value="damage">
                        <span>Damage</span>
                    </label>
                </div>

                <div class="ro-group">
                    <label class="ro-check">
                        <input type="checkbox" id="ro-dr"/>
                        <span>Damage Reduction</span>
                    </label>
                    <label class="ro-check">
                        <input type="checkbox" id="ro-support"/>
                        <span>Support effects</span>
                    </label>
                </div>
            </div>
        </section>

        <section class="sa-card" aria-labelledby="sa-title">
            <h2 id="sa-title" style="margin:0 0 .75rem; color:#fff;">Stat Allocation</h2>

            <div class="sa-row">
                <label for="sa-spec">Healing spec</label>
                <select id="sa-spec" required>
                    <option value="" disabled selected>Select a spec…</option>
                </select>
            </div>

            <div class="sa-row">
                <label for="sa-hero">Hero talent</label>
                <select id="sa-hero" required disabled>
                    <option value="" disabled selected>Select a hero talent…</option>
                </select>
            </div>
        </section>

        <section class="sa-card sa-chart" id="sa-chart-card">
            <div class="sa-stats">
                <div class="sa-best" id="sa-best">Best Allocation</div>
                <div class="sa-stat"><span class="val" id="val-crit">0</span> <span class="name">Critical Strike</span></div>
                <div class="sa-stat"><span class="val" id="val-haste">0</span> <span class="name">Haste</span></div>
                <div class="sa-stat"><span class="val" id="val-mastery">0</span> <span class="name">Mastery</span></div>
                <div class="sa-stat"><span class="val" id="val-vers">0</span> <span class="name">Versatility</span></div>
            </div>

            <div class="sa-canvas">
                <canvas id="sa-radar" width="520" height="520" aria-label="Stat Allocation Radar"></canvas>
            </div>
        </section>
    </main>

    <script src="/js/site.js"></script>
    <script type="module" src="/js/stat-alloc.js"></script>
</body>
</html>
