<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Simulation Results</title>
    <link rel="stylesheet" href="/css/site.css">
    <link rel="stylesheet" href="/css/results.css">
    <link rel="stylesheet" href="css/result-options.css">
    <script>
        const whTooltips = {
            colorLinks: true,
            iconizeLinks: false,
            renameLinks: false,
            hide: { sellprice: true }
        };
    </script>
    <script defer src="https://wow.zamimg.com/js/tooltips.js"></script>
</head>
<body>
    <div id="site-header"></div>
    <h1>Simulation Results</h1>
    <div class="page-wrap">
        <section id="fight-summary" class="fs">
            <!-- Player card -->
            <div class="fs-card fs-player">
                <div class="fs-left">
                    <div class="fs-icon-row">
                        <img id="fs-spec-icon" class="fs-icon" alt="">
                        <img id="fs-hero-icon" class="fs-icon" alt="">
                    </div>
                </div>

                <div class="fs-main">
                    <div id="fs-player-name" class="fs-title">PlayerName</div>
                    <div class="fs-metrics">
                        <div><span class="label">HPS</span><span class="val" id="fs-hps">0</span></div>
                        <div><span class="label">DPS</span><span class="val" id="fs-dps">0</span></div>
                        <div><span class="label">DTPS</span><span class="val" id="fs-dtps">0</span></div>
                    </div>
                </div>
            </div>

            <!-- Fight/Boss card -->
            <div class="fs-card fs-fight">
                <div class="fs-left">
                    <img id="fs-boss-icon" class="fs-icon fs-icon-lg" alt="">
                </div>

                <div class="fs-main">
                    <div class="fs-title">
                        <span id="fs-boss-name">BossName</span>
                        <span id="fs-diff" class="fs-chip">Mythic</span>
                    </div>
                    <div class="fs-sub">
                        <span id="fs-time">0:00</span> ·
                        <span id="fs-outcome">—</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="card ro" id="result-options" aria-labelledby="ro-title">

            <div class="ro-row">
                <div class="ro-group">
                    <label class="ro-radio">
                        <input type="radio" name="ro-metric" value="total" checked>
                        <span>Total</span>
                    </label>
                    <label class="ro-radio">
                        <input type="radio" name="ro-metric" value="heal">
                        <span>Heal</span>
                    </label>
                    <label class="ro-radio">
                        <input type="radio" name="ro-metric" value="damage">
                        <span>Damage</span>
                    </label>
                </div>

                <div class="ro-group">
                    <label class="ro-check">
                        <input type="checkbox" id="ro-dr" />
                        <span>Damage Reduction</span>
                    </label>
                    <label class="ro-check">
                        <input type="checkbox" id="ro-support" />
                        <span>Support effects</span>
                    </label>
                </div>
            </div>
        </section>
    </div>
        <canvas id="resultsChart"></canvas>

        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script type="module" src="/js/results.js"></script>
        <script type="module" src="/js/shared/result-options.js"></script>
        <script src="/js/site.js"></script>
</body>
</html>
